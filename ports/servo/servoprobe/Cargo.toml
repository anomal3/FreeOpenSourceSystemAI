[package]
name = "servoprobe"
version = "0.1.0"
edition = "2021"
description = "N5/N6: Servo 0.8 на FreeOS — страница без окна, рисование swgl (программный GL Firefox), снимок в PNG"
publish = false

# Отдельный workspace: собирается в контейнере fossai-builder
# (ports/servo/builder/build-servoprobe.sh <арх>) целью <арх>-unknown-freeos.
[workspace]

[dependencies]
# Без default-features: без js_jit, multiprocess (gaol, песочница), clipboard,
# devtools; без media-gstreamer, webxr, webgpu, webgl, bluetooth (ROADMAP N4).
# baked-in-resources — файлы ресурсов Servo (user-agent CSS и т. п.) внутри
# программы.
servo = { version = "=0.8.0", default-features = false, features = ["baked-in-resources"] }
# Нет fork — каналы между «процессами» Servo только внутри процесса.
ipc-channel = { version = "0.23", features = ["force-inprocess"] }
# У servo-fonts freetype-sys закрыт cfg по ОС, а webrender тянет его и так:
# FreeType и libpng — из исходников крейта.
freetype-sys = { version = "0.23", features = ["bundled"] }
# Рисование без видеокарты: swgl — программный OpenGL из Firefox («Software
# WebRender»), `swgl::Context` реализует `gleam::Gl`. Без surfman/EGL/dlopen.
swgl = "0.70"
gleam = "0.15"
glow = "0.17"
dpi = "0.1"
url = "2.5"
# Только ради типа ошибки в `RenderingContext::make_current`.
surfman = { version = "0.14", default-features = false }
# Оболочка браузера (N7): egui, нарисованный процессором прямо в пиксели окна
# (без GL и без winit — окна наши, `freeos_window_*`).
egui = { version = "0.34", default-features = false, features = ["default_fonts"] }
egui_software_backend = { version = "0.0.3", default-features = false, features = ["std"] }
# Синхронизация (N10): журналы операций, площадки, вход — без своих
# зависимостей; HTTPS для неё — rustls с корнями webpki (те же, что у Servo).
browser-sync = { path = "../../../crates/browser-sync", features = ["std"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws-lc-rs", "logging"] }
webpki-roots = "1"
# Ответы своей схемы obsos:// (типы заголовков net_traits).
http = "1"
# Хранилище паролей: Argon2id → XChaCha20-Poly1305 (крейты уже в дереве Servo).
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
sha2 = "0.10"
# Проверка утечки пароля (Have I Been Pwned хранит SHA-1 префиксы).
sha1 = "0.10"
getrandom = "0.4"

[patch.crates-io]
# Холст egui не обновлялся, когда фигура исчезала (закрытая панель оставалась
# поверх страницы) — копия с правкой, см. ports/servo/egui-software-backend/FREEOS.md.
egui_software_backend = { path = "../egui-software-backend" }

[profile.release]
panic = "abort"
debug = false
codegen-units = 16
strip = true
