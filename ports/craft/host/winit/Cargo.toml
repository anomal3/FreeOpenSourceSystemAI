[package]
name = "winit"
# Заглушка вместо winit 0.30 (`[patch.crates-io]` в --config сборки Craft):
# приложения Craft держат winit прямой зависимостью «для прочих Unix», а под
# FreeOS окна даёт наш eframe (ports/craft/host/eframe). Код, который зовёт
# winit, на FreeOS выключен правками ports/craft/<app>/*.patch.
version = "0.30.13"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[features]
default = []
android-game-activity = []
android-native-activity = []
mint = []
rwh_04 = []
rwh_05 = []
rwh_06 = []
serde = []
wayland = []
wayland-csd-adwaita = []
wayland-csd-adwaita-crossfont = []
wayland-csd-adwaita-notitle = []
wayland-dlopen = []
x11 = []
