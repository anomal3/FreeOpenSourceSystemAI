# The web server, read by /bin/httpd at start.
#
# This is the reference copy: it arrives with the system image and is replaced
# with it. Edits belong in /etc/httpd.cfg, which is read first and which an
# update never touches.
#
# Anything named on the command line wins over this file, so a second server on
# another port needs no second file:
#
#   httpd --port 8081 --root /srv/other
#
# The server does not start by itself. It is not listed in `services` on
# purpose: a machine that answers on a port because somebody installed the
# system is a machine whose owner did not decide to answer on a port. Add the
# line below to /etc/services when you mean it:
#
#   httpd /bin/httpd 0 0

# The port to listen on. 8080 rather than 80 because a port under 1024 asks for
# privileges elsewhere, and a server that needs privileges eventually gets them.
port=8080

# Where the site lives. The server appends nothing to this but the path the
# request asked for, after that path has been decoded and stripped of `..`.
root=/usr/share/httpd

# Extra directories grafted into the tree. Repeat the line for each one:
#
#   mount=/files /media
#
# Everything under the prefix is served from the directory, with the same path
# rules as the root. A directory without an index.html answers 404: the names of
# what lies on a disk are already something about the machine.

# What to hand to somebody else. Repeat the line for each prefix:
#
#   proxy=/up 10.0.2.2 2002
#
# The prefix is stripped, the rest goes on to that address, and the answer comes
# back as ours. Only GET and HEAD travel; an upstream answering in chunks gets
# a 502, because the length of a message is not something to guess at.
