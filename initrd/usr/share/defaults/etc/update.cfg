# Where FreeOS looks for updates, read by /bin/sysupdate.
#
# This is the reference copy: it arrives with the system image and is replaced
# with it. To point a machine somewhere else, put your own /etc/update.cfg
# next to it -- that file is read first and an update never touches it.
#
# There are two ways to name a repository, and both work:
#
#   server=  a bare address or name; port= and path= belong to it
#   server=  a full http:// or https:// address ending in a slash
#
# Repositories are tried in the order they are listed here, and the first one
# that answers with a signed index wins. The bare form always goes first: it
# is the form every already-installed machine has in its /etc, and an update
# cannot reach into /etc to rewrite it.
#
# Trust does not come from the channel. What makes an update trustworthy is
# the Ed25519 signature the kernel checks before writing a single byte into
# the slot, and it does not care whether the bytes arrived over TLS or not.
# HTTPS is here for one practical reason: GitHub will not serve us otherwise,
# and a single update server is a promise resting on a single machine.

# The main repository: ours, plain HTTP, signature-checked like everything else.
server=89.125.121.42
port=80
path=/freeos/

# The spare: GitHub Releases, which is HTTPS-only. The index and the images are
# release assets, so the path is the download directory of the latest release
# and the file names are the asset names. Getting there costs two redirects --
# latest -> the tagged release -> the CDN -- and /bin/sysupdate follows them,
# refusing only to step down from https to http along the way.
#
# The roots needed to check that server live in ca.pem next to this file.
server=https://github.com/anomal3/FreeOpenSourceSystemAI/releases/latest/download/
