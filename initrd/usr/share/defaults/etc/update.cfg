# Where FreeOS looks for updates, read by /bin/sysupdate.
#
# This is the reference copy: it arrives with the system image and is replaced
# with it. To point a machine somewhere else, put your own /etc/update.cfg
# next to it -- that file is read first and an update never touches it.
#
#   server=  address or name of the repository host
#   port=    TCP port; 80 unless said otherwise
#   path=    directory on that host holding index, index.sig and the images
#
# The transport is plain HTTP on purpose, not an oversight: what makes an
# update trustworthy is the Ed25519 signature the kernel checks before writing
# a single byte into the slot, not the channel it arrived through. TLS over
# that would only hide which version is being fetched, and it costs X.509,
# certificate chains and a root store -- phase 39a. The practical consequence
# is stated out loud: this cannot fetch from GitHub, which serves HTTPS only.
server=89.125.121.42
port=80
path=/freeos/
