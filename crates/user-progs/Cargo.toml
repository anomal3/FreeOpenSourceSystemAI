[package]
name = "user-progs"
description = "Programs that run outside the kernel: the syscall shim and the first two binaries."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
user-abi = { path = "../user-abi" }
# Разбор контейнера `.fpk` — тот же код, которым его собирает `xtask` и читает
# ядро. Разбирается без кучи, поэтому годится и здесь.
fpk = { path = "../fpk" }
# Транспорт SSH: пакетный слой, обмен ключами и шифрование. Программа, а не
# ядро, — сервер обязан уметь падать, не унося систему.
ssh = { path = "../ssh" }
# Доверенные ключи и формат индекса репозитория — тот же разбор, которым ядро
# проверяет контейнер, а `xtask` собирает индекс.
osupdate = { path = "../osupdate" }

[lints]
workspace = true

# Раскрутка стека здесь не отключается отдельно: у таргетов `*-unknown-none`
# стратегия паники — abort по самой спецификации таргета. Обработчик паники в
# программе свой и заканчивается системным вызовом.
