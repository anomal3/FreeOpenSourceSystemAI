[package]
name = "user-progs"
description = "Programs that run outside the kernel: the syscall shim and the first two binaries."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
user-abi = { path = "../user-abi" }
# Разбор контейнера `.fpk` — тот же код, которым его собирает `xtask` и читает
# ядро. Разбирается без кучи, поэтому годится и здесь.
fpk = { path = "../fpk" }
# Транспорт SSH: пакетный слой, обмен ключами и шифрование. Программа, а не
# ядро, — сервер обязан уметь падать, не унося систему.
ssh = { path = "../ssh" }
# Доверенные ключи и формат индекса репозитория — тот же разбор, которым ядро
# проверяет контейнер, а `xtask` собирает индекс.
osupdate = { path = "../osupdate" }
# TLS 1.3 и разбор сертификатов — фаза 39a. Тоже в программе, а не в ядре: и
# рукопожатие, и проверка цепочки — это разбор чужих байтов, и падать он обязан
# вместе с программой, а не вместе с системой.
tls = { path = "../tls" }
x509 = { path = "../x509" }
# Рисование: те же поверхности, шрифт и элементы, которыми рисует стол. С фазы
# 47b окно есть и у программы, и рисовать в нём она обязана тем же самым — иначе
# монитор системы, уехавший из ядра, выглядел бы чужим на своём же столе.
mini-ui = { path = "../mini-ui" }
# Куча. Тот же аллокатор, что у ядра, и по той же причине: свободные блоки в
# односвязном списке, заголовки внутри самих блоков, стороннего хранилища не
# нужно. `default-features = false` убирает зависимость `spinning_top` — замок
# здесь не нужен вовсе (см. `ProgramHeap` в `lib.rs`).
linked_list_allocator = { version = "0.10.6", default-features = false }

[lints]
workspace = true

# Раскрутка стека здесь не отключается отдельно: у таргетов `*-unknown-none`
# стратегия паники — abort по самой спецификации таргета. Обработчик паники в
# программе свой и заканчивается системным вызовом.
