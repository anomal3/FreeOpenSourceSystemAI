[package]
name = "mini-ui"
description = "Framebuffer drawing shared by the kernel compositor and the UEFI installer: surfaces, text, widgets."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
boot-info = { path = "../boot-info" }
# `default-features = false` drops the `std` and `unicode` features; what remains
# is `font8x8::legacy`, a dependency-free table of `[u8; 8]` glyph rows.
font8x8 = { version = "0.3.1", default-features = false }

[lints]
workspace = true
