[package]
name = "installer"
description = "Graphical UEFI installer: picks a disk, writes GPT, formats the ESP and installs FreeOS onto it."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "installer"
path = "src/main.rs"
# Причина та же, что у boot-uefi: тестового окружения на UEFI-таргете нет.
test = false
bench = false

[dependencies]
boot-info = { path = "../boot-info" }
# Время прошивки в секунды эпохи. Тот же крейт считает дату в загрузчике и в
# ядре — трём копиям одного алгоритма разойтись было бы негде, кроме как молча.
calendar = { path = "../calendar" }
# Разметка носителя. Тот же крейт, которым `xtask image` собирает образ на
# хосте, — и это главное: то, что проверено `cargo test`, здесь исполняется.
disk = { path = "../disk" }
# Корневая файловая система. Тот же крейт потом читает ядро — одна реализация
# формата на запись и на чтение.
ext2 = { path = "../ext2" }
# Запись о слотах: установщик её создаёт, загрузчик правит, ядро подтверждает.
slots = { path = "../slots" }
mini-ui = { path = "../mini-ui" }
uefi = { version = "0.39", features = ["alloc", "global_allocator", "panic_handler"] }

[lints]
workspace = true
