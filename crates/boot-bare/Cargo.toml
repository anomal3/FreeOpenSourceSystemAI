[package]
name = "boot-bare"
description = "A kernel image a phone's own bootloader can start: Linux arm64 contract, device tree in x0."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "boot-bare"
path = "src/main.rs"
test = false
bench = false

[dependencies]
fdt = { path = "../fdt" }

[features]
# Проба для аппарата, у которого нет ни серийной линии, ни известного экрана.
#
# Первым же делом бесконечно пинает сторожевой таймер MediaTek и больше не
# делает ничего. Смысл в том, что она не зависит **ни от чего**: ни от разбора
# дерева, ни от того, верно ли мы умеем таймер гасить. Аппарат остался жив —
# наш код исполняется; перезагрузился через несколько секунд — не исполняется.
# Ровно один бит, но тот самый, без которого все остальные опыты бессмысленны.
#
# На машине без этого регистра проба отдаёт исключение, поэтому по умолчанию
# выключена.
mtk-probe = []

# Держать аппарат живым после того, как всё сделано.
#
# Погашенного таймера мало: на аппарате нашёлся ещё один сброс, примерно через
# минуту стояния. Разглядывать экран под таким сроком неудобно, а разглядывать
# его надо — это единственный отчёт. Вечный пинок снимает вопрос целиком.
mtk-keepalive = []
