[package]
name = "kernel"
description = "Freestanding FreeOS kernel: memory, interrupts, tasks, FAT32, USB input, compositor and shell."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "kernel"
path = "src/main.rs"
# There is no test harness on a bare-metal target: `cargo test` would try to
# link libtest against std. Disabling both keeps `cargo test --workspace` sane.
test = false
bench = false

[dependencies]
boot-info = { path = "../boot-info" }
# Дата из секунд эпохи и обратно. Тот же крейт считает время в загрузчике и в
# установщике — расходиться им негде.
calendar = { path = "../calendar" }
# Разбор таблицы разделов. Тот же код, которым размечает диск установщик, — то
# есть ядро читает разметку ровно так, как её писали.
disk = { path = "../disk" }
# Корневая файловая система, тот же крейт, что у установщика.
ext2 = { path = "../ext2" }
# Запись о слотах на ESP: тот же формат, который пишет загрузчик и создаёт
# установщик. Ядро подтверждает ею удачную загрузку.
slots = { path = "../slots" }
# Проверка подписи обновления. Тот же крейт, которым подписывает `xtask` и
# которым SSH проверяет обмен ключами: две реализации Ed25519 разошлись бы
# молча, а выглядело бы это как испорченный файл обновления.
ed25519-dalek = { version = "2", default-features = false }
# Формат `.fpk`: `sysupdate` разбирает им контейнер обновления.
fpk = { path = "../fpk" }
# Доверенные ключи: тот же разбор `/os-keys`, которым пользуется программа
# обновления. Два разбора одного файла по разные стороны границы привилегий
# разошлись бы молча.
osupdate = { path = "../osupdate" }
# Разбор HID Report Descriptor. Отдельный крейт потому, что ошибаются в нём
# битовыми смещениями, а такую ошибку ловят тестом на хосте, а не курсором,
# который ездит наискось в эмуляторе.
usb-hid = { path = "../usb-hid" }
# `default-features = false` drops the `std` and `unicode` features; what remains
# is `font8x8::legacy`, a dependency-free table of `[u8; 8]` glyph rows. The
# kernel still uses it directly for the boot console, which draws into the
# framebuffer before the compositor exists.
font8x8 = { version = "0.3.1", default-features = false }
# Рисование: поверхности, текст и композиция. Тот же крейт использует
# установщик — интерфейс системы и интерфейс её установки обязаны выглядеть
# одинаково, а два набора примитивов рисования разошлись бы.
mini-ui = { path = "../mini-ui" }
# Номера системных вызовов. Тот же крейт подключают пользовательские программы:
# две таблицы констант разошлись бы молча.
user-abi = { path = "../user-abi" }
# Куча ядра. `default-features = false` выключает `use_spin`, а с ним и
# зависимость `spinning_top`: замок ядро ставит своё (см. `sync::Racy`), и второй
# внутри аллокатора был бы лишним. Остаётся сам `Heap` — свободные блоки в
# односвязном списке, заголовки внутри самих блоков, стороннего хранилища не
# требуется.
linked_list_allocator = { version = "0.10.6", default-features = false }

[lints]
workspace = true
