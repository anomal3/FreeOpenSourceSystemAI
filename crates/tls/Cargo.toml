[package]
name = "tls"
description = "TLS 1.3 client: one cipher suite, one group, no tickets — enough to fetch a file over HTTPS."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# Хеш и обмен ключами — те же крейты, что у SSH (фаза 37). Одна реализация на
# две задачи: разойтись они могут только вместе.
sha2 = { version = "0.10", default-features = false }
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets"] }
# А вот AEAD здесь **готовый**, в отличие от SSH, и это не непоследовательность.
# У SSH `chacha20-poly1305@openssh.com` — своя конструкция с двумя ключами; в
# TLS 1.3 стоит ровно RFC 8439, тот самый, который этот крейт и реализует.
# Собирать его из частей второй раз значило бы завести второе место, где можно
# перепутать порядок.
chacha20poly1305 = { version = "0.10", default-features = false }
# Сертификаты.
x509 = { path = "../x509" }

[dev-dependencies]
hex = "0.4"
# Проверка на **чужой** реализации. Наш клиент разговаривает с `rustls` прямо в
# `cargo test`, без эмулятора и без сети: рукопожатие, в котором обе стороны
# наши, доказывает только то, что две копии одной ошибки согласны друг с другом.
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rcgen = "0.13"

[lints]
workspace = true
