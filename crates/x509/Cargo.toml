[package]
name = "x509"
description = "X.509 certificates: DER parsing, chain verification, RSA and ECDSA signatures — no_std, no allocator."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# Хеши. Тот же крейт, что у SSH: две реализации SHA-256 — одна у подписывающего,
# другая у проверяющего — расходятся молча.
sha2 = { version = "0.10", default-features = false }
# Эллиптические кривые — чужие, и по той же причине, что записана в фазе 37:
# своя реализация без постоянного времени исполнения не проверяется тестами.
# Здесь мы только **проверяем** чужие подписи, то есть секрета в руках нет, —
# но арифметика по модулю простого числа ошибается тихо, и это второй довод.
#
# Кривых две, и это не запас: цепочка github.com оканчивается корнем с ключом
# P-384, а лист подписан ключом P-256. Одной кривой хватило бы ровно до первой
# настоящей проверки.
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
p384 = { version = "0.13", default-features = false, features = ["ecdsa"] }
# Обобщённый интерфейс проверки по готовому хешу. Нужен именно он, а не `verify`:
# лист подписывают SHA-256, промежуточный — SHA-384, и длина хеша не совпадает с
# длиной поля кривой. Правило усечения записано в FIPS 186-4, и написать его
# самому означало бы написать его иначе.
signature = { version = "2", default-features = false }
# Григорианская арифметика для сроков действия. Тот же крейт, которым считают
# дату загрузчик, установщик и ядро: две реализации календаря разъезжаются на
# високосных годах, и разъезжаются раз в четыре года.
calendar = { path = "../calendar" }

# RSA своей длинной арифметикой, без крейта: `rsa` тянет кучу, а нам нужно
# возведение в степень по модулю с показателем в семнадцать бит. См. `bigint`.

[dev-dependencies]
hex = "0.4"

[lints]
workspace = true
