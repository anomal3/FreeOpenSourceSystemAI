[package]
name = "fpk"
description = "The FreeOS package container: header, manifest and payload, parsed the same way by the tooling, the installer, the kernel and the programs."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# SHA-256 для подписи: тот же крейт, которым считает хеши SSH (фаза 37). Он
# `no_std` и без кучи, поэтому годится всем четверым читателям формата — и
# ядру, и программе, и установщику, и сборщику. Своя реализация здесь была бы
# ровно тем, чего проект не делает: криптография чужая и проверенная.
#
# `force-soft` — не про скорость, а про то, где этот код исполняется. Без него
# sha2 на x86-64 берёт свой векторный путь (SHA-NI и AVX2), а ядро собирается
# таргетом `x86_64-unknown-none`, у которого объявлено `-sse,+soft-float`:
# векторных регистров обработчик прерывания не сохраняет, поэтому их там нет
# вовсе. Компиляция такого пути кончается не предупреждением, а падением LLVM
# на codegen — то есть `cargo check` о нём молчит.
sha2 = { version = "0.10", default-features = false, features = ["force-soft"] }

[features]
# Сборка пакета нужна только `xtask`, и она единственная требует кучи. Разбор
# обходится без неё намеренно: разбирать пакет приходится программе вне ядра, а
# там аллокатора нет вовсе.
default = []
build = []

[lints]
workspace = true
