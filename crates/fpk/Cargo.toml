[package]
name = "fpk"
description = "The FreeOS package container: header, manifest and payload, parsed the same way by the tooling, the installer, the kernel and the programs."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# SHA-256 для подписи: тот же крейт, которым считает хеши SSH (фаза 37). Он
# `no_std` и без кучи, поэтому годится всем четверым читателям формата — и
# ядру, и программе, и установщику, и сборщику. Своя реализация здесь была бы
# ровно тем, чего проект не делает: криптография чужая и проверенная.
sha2 = { version = "0.10", default-features = false }

[features]
# Сборка пакета нужна только `xtask`, и она единственная требует кучи. Разбор
# обходится без неё намеренно: разбирать пакет приходится программе вне ядра, а
# там аллокатора нет вовсе.
default = []
build = []

[lints]
workspace = true
