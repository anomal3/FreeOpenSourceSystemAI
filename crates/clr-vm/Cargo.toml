[package]
name = "clr-vm"
description = "The own .NET runtime: an IL interpreter over clr-meta, run by /bin/dotnet on FreeOS and by cargo xtask clr-check on the host (milestone v0.7c)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# Разбор сборки. Интерпретатор берёт из него байты IL, сигнатуры и имена, и
# ничего не разбирает сам: формат читает один крейт, проверенный чужим читателем.
clr-meta = { path = "../clr-meta" }
# Математика `System.Math` без `std`: синусы, логарифмы и степени на чистом
# Rust (порт musl). В `core` из них только арифметика.
libm = "0.2"
# Растеризатор `System.Drawing` (фаза N9): пути, перья, сглаживание, отсечение.
raster = { path = "../raster" }

[features]
# Хост с настоящими файлами в каталоге-песочнице (`clr_vm::sandbox`) — для
# `cargo xtask clr-check`. На FreeOS не нужен: там файлы даёт `/bin/dotnet`.
std = []

[lints]
workspace = true
