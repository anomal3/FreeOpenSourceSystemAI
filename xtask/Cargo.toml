[package]
name = "xtask"
description = "Host-side build/run orchestrator: builds the UEFI bootloader and the kernel per architecture, lays them out on an ESP and boots it under QEMU."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# Версии сверены с crates.io (crates.io/api/v1/crates/{clap,anyhow,fatfs}) на 2026-08-11.
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
# Разметка образа диска. Тот же крейт, которым установщик размечает настоящий
# носитель: две реализации одного формата разошлись бы, и разошлись бы молча.
disk = { path = "../crates/disk" }
# Чужой читатель ext2 для `xtask inspect`: результат установки надо смотреть
# не своим же кодом, иначе проверка ничего не доказывает.
ext4-view = "0.9"
# Форматирование initrd.img в FAT32 и запись в него файлов.
# chrono отключён намеренно: единственное, за что он отвечает, — проставление
# текущего времени в записи каталогов, а это делает образ невоспроизводимым
# (два прогона на одном и том же initrd/ давали бы разные байты). Без него
# используется NullTimeProvider и метки времени остаются нулевыми.
fatfs = { version = "0.3.6", default-features = false, features = ["std", "alloc"] }

[lints]
workspace = true
