[package]
name = "wininst"
version = "0.1.0"
edition = "2021"
description = "Установщик-проба для Proton в FossAi: ярлыки «Пуска» и стола через IShellLink и сопоставление .txt в реестре, как у NSIS"

# Отдельный проект для Windows (x86_64-pc-windows-msvc), не член рабочей области ядра.
[workspace]

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "s"
panic = "abort"
