[package]
name = "d3dprobe"
version = "0.1.0"
edition = "2021"
description = "Проба DirectX 9/11/12 для Proton в FossAi: окно, очистка цветом, FPS в stderr"

# Отдельный проект для Windows (x86_64-pc-windows-msvc), не член рабочей области ядра.
[workspace]

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Direct3D9",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input_XboxController",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "s"
panic = "abort"
