[workspace]
resolver = "2"
members = [
    "xtask",
    "crates/boot-bare",
    "crates/boot-info",
    "crates/boot-uefi",
    "crates/calendar",
    "crates/disk",
    "crates/ext2",
    "crates/fdt",
    "crates/fpk",
    "crates/installer",
    "crates/kernel",
    "crates/mini-ui",
    "crates/osupdate",
    "crates/slots",
    "crates/ssh",
    "crates/tls",
    "crates/usb-hid",
    "crates/user-abi",
    "crates/user-progs",
    "crates/x509",
]

# Bare-metal crates cannot be built for the host triple. A bare `cargo build`
# therefore only builds the host-side tooling; kernel/bootloader crates are
# built through `cargo xtask build --arch <arch>`, which passes --target.
default-members = ["xtask"]

[workspace.package]
# Веха, а не счётчик правок. Поднимается руками и только тогда, когда система
# стала другой: 0.1 была системой, которая загружается и рисует стол; 0.2 —
# установленной системой с настоящими правами; 0.3 умеет сеть, обновляется по
# ней и проверяет, с кем разговаривает (фазы 34-39a). Номер сборки к этому
# приписывает `xtask` сам, и в имени образа стоит `0.3.<сборка>`.
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
