[workspace]
resolver = "2"
members = [
    "xtask",
    "crates/aml",
    "crates/boot-bare",
    "crates/boot-info",
    "crates/boot-uefi",
    "crates/btrfs",
    "crates/calendar",
    "crates/clr-meta",
    "crates/clr-vm",
    "crates/disk",
    "crates/ext2",
    "crates/fdt",
    "crates/fpk",
    "crates/fuzz",
    "crates/freeos-cc",
    "crates/http",
    "crates/installer",
    "crates/kernel",
    "crates/mini-ui",
    "crates/osupdate",
    "crates/raster",
    "crates/slots",
    "crates/ssh",
    "crates/swipe",
    "crates/sysconf",
    "crates/tls",
    "crates/usb-hid",
    "crates/user-abi",
    "crates/user-progs",
    "crates/x509",
]

# Bare-metal crates cannot be built for the host triple. A bare `cargo build`
# therefore only builds the host-side tooling; kernel/bootloader crates are
# built through `cargo xtask build --arch <arch>`, which passes --target.
default-members = ["xtask"]

[workspace.package]
# Веха, а не счётчик правок. Поднимается руками и только тогда, когда система
# стала другой: 0.1 была системой, которая загружается и рисует стол; 0.2 —
# установленной системой с настоящими правами; 0.3 умеет сеть, обновляется по
# ней и проверяет, с кем разговаривает (фазы 34-39a). 0.4–0.7 — память по
# запросу и второе ядро, libc и набор для сборки, окна программ, btrfs, стол по
# эскизу и своя среда .NET с WinForms (до фазы N8); Роман поднял версию сразу до
# 0.7 16.09.2026, промежуточные номера образами не выходили. 0.8 (18.10.2026,
# Роман) — драйверы железа: звук HDA, SDL2 и игры, VirtualBox, хабы и флешки
# USB, сеть по USB, вход по SSH в живую систему (веха v0.12). Номер сборки к
# этому приписывает `xtask` сам, и в имени образа стоит `0.8.<сборка>`; с 0.8
# он виден и в «О системе» (файл `\FREEOS\BUILD` на ESP).
version = "0.8.0"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

# btrfs оптимизируется и в отладочной сборке. Фиксация транзакции считает
# crc32c по каждому перестроенному узлу, а `fsck` — по каждому сектору данных;
# без оптимизации побайтовый цикл по таблице под эмулятором aarch64 стоил
# двадцать секунд на одну запись файла (фаза 50d). Проверки переполнения и
# `debug_assert` остаются: меняется скорость, а не то, что проверяется.
[profile.dev.package.btrfs]
opt-level = 2

# Своя среда .NET (веха v0.7c) — оптимизированной и в отладочной сборке, и
# причина не только в скорости. Цикл исполнения — один большой `match` на все
# инструкции IL, и без оптимизации компилятор отводит ему кадр под локальные
# переменные всех ветвей разом. У программы третьего кольца стек 64 КиБ
# (`STACK_PAGES` в ядре), и на AArch64 `/bin/dotnet` падал на первом же вызове
# отказом данных на 68 КиБ ниже вершины стека — на x86-64 кадр помещался
# впритык. Поднимать стек всем программам ради одной — не решение.
[profile.dev.package.clr-vm]
opt-level = 2

[profile.dev.package.clr-meta]
opt-level = 2

# Растеризатор `System.Drawing` (фаза N9) — по той же причине, что и среда:
# он перебирает каждую точку фигуры, и без оптимизации заливка окна формы
# 800×450 со сглаживанием стоила бы в эмуляторе секунды на кадр.
[profile.dev.package.raster]
opt-level = 2

# Ядро, стол (`mini-ui`) и программы — тоже с оптимизацией, и это главная
# причина «в QEMU всё лагает» (замер 29.09, сценарий `lag`). Без неё каждый
# попиксельный цикл стола — вызов на точку: кадр перетаскивания окна стоил
# 340 мс на x86-64 и 284 мс на aarch64, загрузка — 74 и 97 с, из них 45–61 с
# на печать оглавления initrd. С `opt-level = 2` — 23 и 19 мс, 7 и 12 с, то
# есть почти release. Ровно то же нашлось на телефоне 16.09 (кадр 355 → 10 мс).
# Проверки переполнения и `debug_assert` остаются: меняется скорость, а не то,
# что проверяется. Для пошаговой отладки в gdb оптимизацию ядра можно снять
# на время, поставив здесь 0.
[profile.dev.package.kernel]
opt-level = 2

[profile.dev.package.mini-ui]
opt-level = 2

[profile.dev.package.user-progs]
opt-level = 2

# Всё, что не наше, — тоже с оптимизацией: сторонние крейты (куча ядра
# `linked_list_allocator`, подпись) и то, что собирает `build-std` (`core`,
# `alloc`, `compiler_builtins` с их `memcpy` и `memset`). Плюс `ext2` и
# `disk`, через которые читаются файлы. Замер 16.10 (фаза 63b, `popups.exe`,
# от `Main` до созданной формы): отладочное ядро — 49,3 с на x86-64 и 46,8 с
# на aarch64, release — 4,4 и 5,7 с; одни сторонние и `build-std` — 6,1 и
# 10,7 с, вместе с `ext2` и `disk` — 4,7 и 6,1 с. Mono трогает десятки тысяч
# страниц и читает мегабайты сборок, и каждая новая страница — `memset` по
# байту, если `compiler_builtins` не оптимизирован. Проверки переполнения и
# `debug_assert` остаются, как и у ядра выше.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.ext2]
opt-level = 2

[profile.dev.package.disk]
opt-level = 2

# Криптография и разборщики сети (фаза 65e): TLS и X.509 у `fetch` и
# `sysupdate`, SSH у `sshd`, подписи обновлений и пакетов, разбор HTTP. Правило
# `"*"` выше наших крейтов не касается, и они оставались без оптимизации:
# ChaCha20 и SHA-256 по байту. Замер — в ROADMAP, фаза 65e.
[profile.dev.package.tls]
opt-level = 2

[profile.dev.package.x509]
opt-level = 2

[profile.dev.package.ssh]
opt-level = 2

[profile.dev.package.osupdate]
opt-level = 2

[profile.dev.package.fpk]
opt-level = 2

[profile.dev.package.http]
opt-level = 2

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
